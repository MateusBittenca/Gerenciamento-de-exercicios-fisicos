services:
  db:
    image: mysql:8.0
    container_name: unifit-mysql
    restart: unless-stopped
    # Pacote npm "mysql" (legado) não suporta caching_sha2_password do MySQL 8
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: unifit
    volumes:
      - unifit_mysql_data:/var/lib/mysql
      - ./database/UNIFIT.sql:/docker-entrypoint-initdb.d/UNIFIT.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  unifit_mysql_data:
